name: CI

on:
  push:
  pull_request:

jobs:
  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test AI service
        run: npm run test

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tests,lint]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Run root unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run backend core unit tests
        run: python -m unittest discover -s backend/src/tests -p "test_*.py"

  frontend:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Provide local research_my_cgn package
        run: |
          root_dir="$(cd .. && pwd)"
          cat > "${root_dir}/package.json" <<'EOF'
          {
            "name": "research_my_cgn",
            "version": "1.0.0",
            "license": "ISC",
            "dependencies": {
              "ws": "^8.18.3"
            }
          }
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
