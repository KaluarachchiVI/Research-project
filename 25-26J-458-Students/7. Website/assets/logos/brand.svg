<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Adaptive Cognitive-Load Study Timer mark">
  <title>Adaptive Cognitive-Load Study Timer</title>
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E76F51"/>
      <stop offset="1" stop-color="#D85B3D"/>
    </linearGradient>
    <linearGradient id="brandShine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#brandGrad)"/>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#brandShine)"/>
  <!-- Cognitive-load arc (3/4 circle, top-right open) -->
  <path d="M16 32 A16 16 0 1 1 32 48" fill="none" stroke="#FFF3B0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Adaptive wave (mini sinusoid through the centre) -->
  <path d="M20 32 Q26 24 32 32 T44 32" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Focus pulse dot at the leading edge -->
  <circle cx="44" cy="32" r="3" fill="#FFFFFF"/>
  <circle cx="44" cy="32" r="5.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
